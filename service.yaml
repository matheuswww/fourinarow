apiVersion: v1
kind: Service
metadata:
  name: fourinarowbackend
spec:
  type: NodePort
  selector:
    app: fourinarowbackend
  ports:
  - port: 8080
    targetPort: 8080

---

apiVersion: v1
kind: Service
metadata:
  name: fourinarowfrontend
spec:
  type: NodePort
  selector:
    app: fourinarowfrontend
  ports:
  - port: 3000
    targetPort: 3000

---

apiVersion: v1
kind: Service
metadata:
  name: mysql
spec:
  selector:
    app: mysql
  ports:
    - protocol: TCP
      port: 3306
      targetPort: 3306
  clusterIP: None
